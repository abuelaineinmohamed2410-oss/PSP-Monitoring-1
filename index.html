<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PSP Monitoring Management System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#dde3ea;--ac:#1f5fa8;--rd:#c0392b;--gn:#2e7d4f;--am:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171d;--card:#1a2129;--tx:#e6ebf1;--mu:#93a1b2;--bd:#2c3642;--ac:#5aa0e6}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
nav{display:flex;gap:4px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 12px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav b{color:var(--ac);margin-right:8px}nav a{padding:6px 10px;border-radius:5px;cursor:pointer;color:var(--mu)}nav a.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}h2{margin:4px 0 12px}h3{margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}.kpi small{color:var(--mu)}.kpi div{font-size:22px;font-weight:600}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--bg);font-weight:600}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:5px;padding:7px 12px;cursor:pointer;font:inherit}button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.d{background:var(--rd)}button.sm{padding:3px 8px;font-size:12px}
input,select,textarea{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--tx);max-width:100%}textarea{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
.tag{padding:2px 7px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}.over{color:var(--rd);font-weight:600}.ok{color:var(--gn)}.warn{color:var(--am)}
.alert{background:#fdecea;border:1px solid var(--rd);color:var(--rd);padding:10px;border-radius:6px;margin-bottom:12px}
.q{border-top:1px solid var(--bd);padding:10px 0}.q .t{font-weight:500}.bar{height:14px;background:var(--ac);border-radius:2px}.demo{font-size:12px;color:var(--mu)}
#login{max-width:340px;margin:12vh auto}.pr{display:none}
@media print{nav,.np,button{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}.pr{display:block}main{max-width:none;padding:0}}
</style></head><body><div id="app"></div>
<script>
const K='psp_db_v1',uid=()=>Math.random().toString(36).slice(2,9),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),addD=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const FD={Daily:1,Weekly:7,Monthly:30,Custom:7},SEV=['Critical','Major','Minor','Observation'];
let db,me,view='dash',tb=null,cur=null,sel=null,app=document.getElementById('app');
function seed(){const hc=[{title:'Patient Interaction',qs:[['Did the agent follow the approved greeting?'],['Was patient identification performed correctly?'],['Was consent captured before collecting data?']]},{title:'Documentation',qs:[['Was the case record completed accurately?'],['Was the adverse event reported within 24 hours?']]}].map(s=>({title:s.title,qs:s.qs.map(q=>({id:uid(),text:q[0],type:'yn'}))}));let n=0;hc.forEach(s=>s.qs.forEach(q=>q.n=++n));
db={users:[{id:'u1',name:'Admin User',role:'Admin',user:'admin',pw:'demo123'},{id:'u2',name:'Mohamed Ahmed',role:'Supervisor',user:'supervisor',pw:'demo123'},{id:'u3',name:'Nour QA',role:'QA',user:'qa',pw:'demo123'},{id:'u4',name:'Sara Khaled',role:'Supervisor',user:'supervisor2',pw:'demo123'}],
agents:[{id:'a1',name:'Ahmed Mohamed',code:'AG-001',program:'Heart Care',sup:'u2',start:'2026-01-05',status:'Active',freq:'Weekly',per:4},{id:'a2',name:'Mona Hassan',code:'AG-002',program:'Enaya',sup:'u2',start:'2026-02-01',status:'Active',freq:'Weekly',per:4},{id:'a3',name:'Omar Saleh',code:'AG-003',program:'Heart Care',sup:'u4',start:'2026-03-10',status:'Active',freq:'Monthly',per:1}],
templates:[{id:'t1',name:'Heart Care Monitoring Annex',program:'Heart Care',versions:[{v:'1.0',status:'Approved',date:'2026-01-01',sections:hc}]}],records:[],audit:[]};
const qs=hc.flatMap(s=>s.qs);[[14,0],[7,1],[0,0]].forEach(([d,k],i)=>{const ans={};qs.forEach((q,j)=>ans[q.id]={a:(j==k&&k)?'No':'Yes',c:'',f:(j==k&&k)?'Greeting not followed':'',sev:'Minor'});db.records.push({id:'MON-2026-'+String(240+i).padStart(6,'0'),agent:'a1',tpl:'t1',v:'1.0',date:addD(today(),-d),sup:'u2',status:'Submitted',ans,score:0,demo:1,sig:'Mohamed Ahmed',signedAt:new Date().toISOString()});});db.records.forEach(r=>r.score=score(r,db));save()}
function save(){}
function log(){sync()}
db={users:[],agents:[],templates:[],records:[],audit:[]};

const tplOf=r=>db.templates.find(t=>t.id==r.tpl),verOf=r=>tplOf(r).versions.find(v=>v.v==r.v),qsOf=v=>v.sections.flatMap(s=>s.qs);
function score(r){const q=qsOf(verOf(r)).filter(q=>q.type=='yn');let y=0,n=0;q.forEach(x=>{const a=(r.ans[x.id]||{}).a;if(a=='Yes')y++;else if(a=='No')n++});return n+y?Math.round(y/(y+n)*100):0}
const agents=()=>db.agents.filter(a=>me.role!='Supervisor'||a.sup==me.id),recs=()=>db.records.filter(r=>me.role!='Supervisor'||r.sup==me.id);
const subs=a=>db.records.filter(r=>r.agent==a.id&&r.status=='Submitted').sort((x,y)=>y.date.localeCompare(x.date));
const nextDue=a=>{const l=subs(a)[0];return l?addD(l.date,FD[a.freq]):a.start},dueSt=a=>a.status!='Active'?'-':nextDue(a)<today()?'Overdue':nextDue(a)==today()?'Due today':nextDue(a)<=addD(today(),7)?'Due this week':'OK';
const sup=id=>(db.users.find(u=>u.id==id)||{}).name||'';
const fnd=()=>recs().filter(r=>r.status=='Submitted').flatMap(r=>qsOf(verOf(r)).filter(q=>(r.ans[q.id]||{}).f).map(q=>({r,q,sev:r.ans[q.id].sev,d:r.ans[q.id].f,x:(r.fx||{})[q.id]||{status:'Open'}})));
const go=v=>{view=v;sel=null;if(v!='mon')cur=null;R()};
function R(){if(!me)return loginV();const nav=['dash:Dashboard','agents:Agents','mon:Monitoring','tpl:Templates','find:Findings','ana:Analytics'].concat(me.role=='Supervisor'?[]:['audit:Audit Log']);
app.innerHTML=`<nav><b>PSP Monitoring</b>${nav.map(x=>{const[k,l]=x.split(':');return`<a class="${view==k?'on':''}" onclick="go('${k}')">${l}</a>`}).join('')}<span style="margin-left:auto" class="demo">${e(me.name)} · ${me.role} <button class="s sm" onclick="out()">Logout</button></span></nav><main>${V[view]()}</main>`}
function loginV(){app.innerHTML=`<div id="login" class="card"><h2>PSP Monitoring Management System</h2><div class="row"><label>Username<input id="lu" autocomplete="username"></label></div><div class="row"><label>Password<input id="lp" type="password" autocomplete="current-password"></label></div><button onclick="login()">Sign in</button><div id="le" class="over"></div></div>`}
const EMPTY=()=>({users:[],agents:[],templates:[],records:[],audit:[]});let q0=Promise.resolve();
function apply(d){const k=cur&&cur.id;db=d;if(k)cur=db.records.find(r=>r.id==k)||cur}
function sync(){q0=q0.then(async()=>{const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({agents:db.agents,templates:db.templates,records:db.records})});if(r.status==401){me=null;R();return{}}const j=await r.json();apply(j.db);if(!cur)R();return j}).catch(()=>({}));return q0}
async function boot(){try{const r=await fetch('/api/state');if(r.ok){const j=await r.json();me=j.me;apply(j.db)}}catch(x){}R()}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:lu.value,pw:lp.value})});if(!r.ok){le.textContent=r.status==429?'Too many attempts. Try later.':'Invalid credentials';return}view='dash';await boot()}
async function out(){await fetch('/api/logout',{method:'POST'});me=null;cur=null;db=EMPTY();R()}
async function addU(){const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:un.value,user:uu.value,role:ur.value,pw:up.value})});if(!r.ok){alert((await r.json()).error||'Failed');return}await boot()}
const V={
dash(){const A=agents().filter(a=>a.status=='Active'),od=A.filter(a=>dueSt(a)=='Overdue'),du=A.filter(a=>dueSt(a)=='Due today'||dueSt(a)=='Due this week'),R2=recs().filter(r=>r.status=='Submitted'),F=fnd();
return`<h2>Welcome, ${e(me.name.split(' ')[0])}</h2>${od.length?`<div class="alert">${od.length} monitoring record(s) overdue: ${od.map(a=>e(a.name)).join(', ')}</div>`:''}
${du.length?`<div class="card"><b>Upcoming:</b> ${du.map(a=>`${e(a.name)} (${dueSt(a)}, ${nextDue(a)})`).join('; ')}</div>`:''}<div class="kpis">${[['Active agents',A.length],['Due',du.length],['Overdue',od.length],['Completed',R2.length],['Open findings',F.filter(isO).length],['Critical',F.filter(f=>f.sev=='Critical'&&isO(f)).length]].map(k=>`<div class="kpi"><small>${k[0]}</small><div>${k[1]}</div></div>`).join('')}</div>
<div class="card"><h3>My Agents</h3><div class="wrap"><table><tr><th>Agent</th><th>Program</th><th>Last</th><th>Next due</th><th>Status</th><th>Score</th><th></th></tr>${A.map(a=>{const l=subs(a)[0];return`<tr><td>${e(a.name)}</td><td>${e(a.program)}</td><td>${l?l.date:'-'}</td><td>${nextDue(a)}</td><td class="${dueSt(a)=='Overdue'?'over':''}">${dueSt(a)}</td><td>${l?l.score+'%':'-'}</td><td><button class="sm" onclick="startM('${a.id}')">Start Monitoring</button> <button class="sm s" onclick="prof('${a.id}')">History</button></td></tr>`}).join('')}</table></div></div>
<div class="card"><h3>Recent Monitoring</h3>${recT(R2.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div></div>`},
agents(){const sups=db.users.filter(u=>u.role=='Supervisor');return`<h2>Agents</h2>${me.role=='QA'?'':`<div class="card np"><div class="row"><label>Name<input id="an"></label><label>Agent ID<input id="ac"></label><label>Program<input id="ap" value="Heart Care"></label><label>Supervisor<select id="as" ${me.role=='Supervisor'?'disabled':''}>${sups.map(s=>`<option value="${s.id}" ${s.id==me.id?'selected':''}>${e(s.name)}</option>`).join('')}</select></label><label>Frequency<select id="af"><option>Daily<option selected>Weekly<option>Monthly<option>Custom</select></label><button onclick="addA()">Add agent</button></div></div>`}
${me.role=='Admin'?`<div class="card np"><b>Add user</b><div class="row"><label>Name<input id="un"></label><label>Username<input id="uu"></label><label>Role<select id="ur"><option>Supervisor<option>QA<option>Admin</select></label><label>Password (10+ chars)<input id="up" type="password"></label><button onclick="addU()">Create user</button></div></div>`:''}${me.role=='QA'?'':`<div class="card np"><b>Import agents</b> <span class="demo">(paste rows copied from Excel, or a .csv: name, id, program)</span><br><textarea id="im" rows="3"></textarea> <input type="file" accept=".csv,.txt" onchange="imF(this)"> <button onclick="importA()">Import</button></div>`}<div class="card wrap"><table><tr><th>Name</th><th>ID</th><th>Program</th><th>Supervisor</th><th>Frequency</th><th>Status</th><th></th></tr>${agents().map(a=>`<tr><td><a href="#" onclick="prof('${a.id}');return false">${e(a.name)}</a></td><td>${e(a.code)}</td><td>${e(a.program)}</td><td>${me.role=='Admin'?`<select onchange="upA('${a.id}','sup',this.value)">${sups.map(s=>`<option value="${s.id}" ${s.id==a.sup?'selected':''}>${e(s.name)}`).join('')}</select>`:e(sup(a.sup))}</td><td>${me.role=='QA'?a.freq:`<select onchange="upA('${a.id}','freq',this.value)">${['Daily','Weekly','Monthly','Custom'].map(f=>`<option ${f==a.freq?'selected':''}>${f}</option>`).join('')}</select>`}</td><td>${me.role=='QA'?a.status:`<select onchange="upA('${a.id}','status',this.value)">${['Active','Inactive','Transferred','Resigned'].map(f=>`<option ${f==a.status?'selected':''}>${f}</option>`).join('')}</select>`}</td><td></td></tr>`).join('')}</table></div><p class="demo">Historical records are retained when an agent becomes inactive.</p>`},
mon(){if(cur)return form();if(sel)return recV(sel);return`<h2>Monitoring</h2><div class="card np"><div class="row"><label>Agent<select id="ms">${agents().filter(a=>a.status=='Active').map(a=>`<option value="${a.id}">${e(a.name)} — ${e(a.program)}</option>`).join('')}</select></label>${me.role=='Supervisor'?`<button onclick="startM(ms.value)">Start Monitoring</button>`:''}</div></div><h3>All records</h3><div class="row np"><label>Status<select onchange="fq.s=this.value;R()">${['','Submitted','Draft'].map(o=>`<option value="${o}" ${fq.s==o?'selected':''}>${o||'All'}`).join('')}</select></label><label>Program<select onchange="fq.p=this.value;R()">${['',...new Set(db.agents.map(a=>a.program))].map(o=>`<option value="${o}" ${fq.p==o?'selected':''}>${o||'All'}`).join('')}</select></label><label>From<input type="date" value="${fq.d}" onchange="fq.d=this.value;R()"></label></div><div class="card">${recT(recs().filter(r=>(!fq.s||r.status==fq.s)&&(!fq.p||db.agents.find(a=>a.id==r.agent).program==fq.p)&&(!fq.d||r.date>=fq.d)).sort((a,b)=>b.date.localeCompare(a.date)))}</div>`},
tpl(){if(tb)return tbV();return`<h2>Templates</h2>${me.role=='QA'?'':`<div class="card np"><h3>Upload Monitoring Annex</h3><p class="demo">Upload a .docx or .txt (original file is never modified), or paste text. Numbered lines become questions; other short lines become sections.</p><div class="row"><label>Annex name<input id="tn" value="Heart Care Monitoring Annex"></label><label>Program<input id="tp" value="Heart Care"></label><label>File<input type="file" id="tf" accept=".docx,.txt" onchange="readF(this)"></label></div><textarea id="tt" rows="7" placeholder="Section 1 - Patient Interaction&#10;1. Did the agent follow the approved greeting?&#10;2. Was patient identification performed correctly?"></textarea><p><button onclick="parseT()">Extract &amp; Review</button></p></div>`}
${db.templates.map(t=>`<div class="card"><b>${e(t.name)}</b> <span class="tag">${e(t.program)}</span><table style="margin-top:8px"><tr><th>Version</th><th>Date</th><th>Questions</th><th>Status</th><th></th></tr>${t.versions.map(v=>`<tr><td>${v.v}</td><td>${v.date}</td><td>${qsOf(v).length}</td><td>${v.status}</td><td>${v.status!='Approved'&&me.role=='Admin'?`<button class="sm" onclick="appr('${t.id}','${v.v}')">Approve</button>`:''}</td></tr>`).join('')}</table></div>`).join('')}`},
find(){const F=fnd();return`<h2>Findings</h2><div class="card wrap"><table><tr><th>Record</th><th>Date</th><th>Agent</th><th>Q</th><th>Severity</th><th>Description</th><th>CAPA / Status</th></tr>${F.map(f=>`<tr><td><a href="#" onclick="sel='${f.r.id}';view='mon';R();return false">${f.r.id}</a></td><td>${f.r.date}</td><td>${e(db.agents.find(a=>a.id==f.r.agent).name)}</td><td>${f.q.n}</td><td>${f.sev}</td><td>${e(f.d)}</td><td>${fxC(f)}</td></tr>`).join('')||'<tr><td colspan=7>No findings</td></tr>'}</table></div>`},
ana(){const A=agents(),R2=recs().filter(r=>r.status=='Submitted'),F=fnd(),avg=x=>x.length?Math.round(x.reduce((s,r)=>s+r.score,0)/x.length):0,progs=[...new Set(A.map(a=>a.program))];
return`<h2>Analytics</h2><div class="kpis"><div class="kpi"><small>Average score</small><div>${avg(R2)}%</div></div><div class="kpi"><small>Records</small><div>${R2.length}</div></div><div class="kpi"><small>Overdue</small><div>${A.filter(a=>dueSt(a)=='Overdue').length}</div></div></div>
<div class="card wrap"><h3>By agent</h3><table><tr><th>Agent</th><th>Avg</th><th>High</th><th>Low</th><th>Records</th><th>Findings</th><th>Trend</th></tr>${A.map(a=>{const s=subs(a).reverse(),sc=s.map(r=>r.score);return`<tr><td>${e(a.name)}</td><td>${avg(s)}%</td><td>${sc.length?Math.max(...sc):'-'}</td><td>${sc.length?Math.min(...sc):'-'}</td><td>${s.length}</td><td>${F.filter(f=>f.r.agent==a.id).length}</td><td style="min-width:120px">${sc.map(x=>`<div class="bar" style="width:${x}%;margin:1px 0" title="${x}%"></div>`).join('')}</td></tr>`}).join('')}</table></div>
<div class="card wrap"><h3>By program</h3><table><tr><th>Program</th><th>Agents</th><th>Avg score</th><th>Findings</th></tr>${progs.map(p=>{const ids=A.filter(a=>a.program==p).map(a=>a.id);return`<tr><td>${e(p)}</td><td>${ids.length}</td><td>${avg(R2.filter(r=>ids.includes(r.agent)))}%</td><td>${F.filter(f=>ids.includes(f.r.agent)).length}</td></tr>`}).join('')}</table></div>
<div class="card"><h3>Findings by severity</h3>${SEV.map(s=>`<div>${s}: ${F.filter(f=>f.sev==s).length}</div>`).join('')}</div><button onclick="csv()">Export CSV</button> <button class="s" onclick="csv(1)">Export Excel</button> <button class="s" onclick="window.print()">Print / PDF</button>`},
audit(){return`<h2>Audit Log</h2><div class="card wrap"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Object</th><th>Previous</th><th>New</th></tr>${db.audit.slice(0,200).map(a=>`<tr><td>${a.t.replace('T',' ').slice(0,19)}</td><td>${e(a.u)}</td><td>${e(a.a)}</td><td>${e(a.o)}</td><td>${e(a.p)}</td><td>${e(a.n)}</td></tr>`).join('')}</table></div>`}};
function recT(L){return`<div class="wrap"><table><tr><th>ID</th><th>Date</th><th>Agent</th><th>Annex</th><th>Ver</th><th>Score</th><th>Status</th></tr>${L.map(r=>`<tr><td><a href="#" onclick="sel='${r.id}';view='mon';R();return false">${r.id}</a></td><td>${r.date}</td><td>${e(db.agents.find(a=>a.id==r.agent).name)}</td><td>${e(tplOf(r).name)}</td><td>${r.v}</td><td>${r.status=='Draft'?'-':r.score+'%'}</td><td>${r.status}</td></tr>`).join('')||'<tr><td colspan=7>None</td></tr>'}</table></div>`}
function prof(id){const a=db.agents.find(x=>x.id==id),s=db.records.filter(r=>r.agent==id).sort((x,y)=>y.date.localeCompare(x.date));view='mon';cur=null;sel=null;app.innerHTML;R();document.querySelector('main').innerHTML=`<h2>${e(a.name)}</h2><p>Program: ${e(a.program)} · Status: ${a.status} · Frequency: ${a.freq}</p><div class="card">${recT(s)}</div><button class="s" onclick="go('agents')">Back</button>`}
function addA(){if(!an.value||!ac.value)return alert('Name and ID required');const a={id:uid(),name:an.value.trim(),code:ac.value.trim(),program:ap.value.trim(),sup:me.role=='Supervisor'?me.id:as.value,start:today(),status:'Active',freq:af.value,per:4};db.agents.push(a);log('Agent created',a.name);R()}
function upA(id,k,v){const a=db.agents.find(x=>x.id==id);log('Agent updated',a.name,a[k],v);a[k]=v;R()}
function readF(i){const f=i.files[0];if(!f)return;if(/\.docx$/i.test(f.name)){const r=new FileReader();r.onload=()=>mammoth.extractRawText({arrayBuffer:r.result}).then(x=>tt.value=x.value).catch(()=>alert('Could not read DOCX; paste text instead'));r.readAsArrayBuffer(f)}else{const r=new FileReader();r.onload=()=>tt.value=r.result;r.readAsText(f)}log('Annex uploaded',f.name)}
function parseT(){const L=tt.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return alert('Add Annex text');const S=[];let c=null;L.forEach(l=>{const m=l.match(/^(\d+)[.)]\s*(.+)/);if(m){if(!c)S.push(c={title:'Section 1',qs:[]});c.qs.push({id:uid(),n:+m[1],text:m[2],type:/\((text|free)/i.test(m[2])?'text':'yn'})}else{if(c&&!c.qs.length)c.title=l;else S.push(c={title:l,qs:[]})}});tb={name:tn.value,program:tp.value,sections:S.filter(s=>s.qs.length)};if(!tb.sections.length)return alert('No numbered questions found');tpl_();R()}
function tpl_(){}
function tbV(){return`<h2>Review Digital Monitoring Form</h2><div class="card"><b>${e(tb.name)}</b> · ${e(tb.program)}</div>${tb.sections.map((s,i)=>`<div class="card"><div class="row"><input value="${e(s.title)}" style="flex:1;font-weight:600" oninput="tb.sections[${i}].title=this.value"><button class="sm d" onclick="tb.sections.splice(${i},1);R()">Delete section</button></div>${s.qs.map((q,j)=>`<div class="row"><input type="number" value="${q.n}" style="width:56px" oninput="tb.sections[${i}].qs[${j}].n=+this.value"><input value="${e(q.text)}" style="flex:1;min-width:180px" oninput="tb.sections[${i}].qs[${j}].text=this.value"><select onchange="tb.sections[${i}].qs[${j}].type=this.value"><option value="yn" ${q.type=='yn'?'selected':''}>Yes/No/N/A (scored)<option value="text" ${q.type=='text'?'selected':''}>Text<option value="num" ${q.type=='num'?'selected':''}>Numeric</select><button class="sm s" onclick="mv(${i},${j},-1)">↑</button><button class="sm s" onclick="mv(${i},${j},1)">↓</button><button class="sm d" onclick="tb.sections[${i}].qs.splice(${j},1);R()">✕</button></div>`).join('')}<button class="sm s" onclick="tb.sections[${i}].qs.push({id:uid(),n:'',text:'',type:'yn'});R()">+ Question</button></div>`).join('')}<button class="s" onclick="tb.sections.push({title:'New section',qs:[]});R()">+ Section</button> <button onclick="pubT()">${me.role=='Admin'?'Approve & publish':'Submit for approval'}</button> <button class="s" onclick="tb=null;R()">Cancel</button>`}
function mv(i,j,d){const q=tb.sections[i].qs,k=j+d;if(k<0||k>=q.length)return;[q[j],q[k]]=[q[k],q[j]];R()}
function pubT(){let n=0;tb.sections.forEach(s=>s.qs.forEach(q=>{n=q.n||n+1;q.n=n}));let t=db.templates.find(x=>x.name==tb.name&&x.program==tb.program);if(!t)db.templates.push(t={id:uid(),name:tb.name,program:tb.program,versions:[]});const v=(t.versions.length+1)+'.0';t.versions.push({v,status:me.role=='Admin'?'Approved':'Pending approval',date:today(),sections:JSON.parse(JSON.stringify(tb.sections))});log('Template created',t.name,'',v);tb=null;R()}
function appr(t,v){const x=db.templates.find(a=>a.id==t).versions.find(a=>a.v==v);x.status='Approved';log('Template approved',t,'',v);R()}
function startM(id){const a=db.agents.find(x=>x.id==id);if(me.role!='Supervisor')return alert('Only supervisors perform monitoring');const t=db.templates.find(x=>x.program==a.program&&x.versions.some(v=>v.status=='Approved'));if(!t)return alert('No approved Annex for '+a.program);const v=[...t.versions].reverse().find(v=>v.status=='Approved');cur={id:'DRAFT-'+uid(),agent:id,tpl:t.id,v:v.v,date:today(),sup:me.id,status:'Draft',ans:{},score:0,sig:''};log('Monitoring started',a.name);view='mon';sel=null;R()}
function form(){const r=cur,v=verOf(r),a=db.agents.find(x=>x.id==r.agent);return`<h2>${e(tplOf(r).name)} <span class="tag">v${r.v}</span></h2><div class="card">Agent: <b>${e(a.name)}</b> (${e(a.code)}) · Program: ${e(a.program)} · Supervisor: ${e(me.name)} · Date: <input type="date" value="${r.date}" onchange="cur.date=this.value"> · Type: ${a.freq}</div>${v.sections.map(s=>`<div class="card"><h3>${e(s.title)}</h3>${s.qs.map(q=>{const x=r.ans[q.id]||{};return`<div class="q"><div class="t">${q.n}. ${e(q.text)}</div>${q.type=='yn'?['Yes','No','N/A'].map(o=>`<label><input type="radio" name="q${q.id}" ${x.a==o?'checked':''} onchange="sa('${q.id}','a','${o}')"> ${o}</label> `).join(''):`<input value="${e(x.a||'')}" ${q.type=='num'?'type=number':''} oninput="sa('${q.id}','a',this.value,1)" style="width:100%">`}<div class="row" style="margin-top:6px"><input placeholder="Comments" value="${e(x.c||'')}" style="flex:1" oninput="sa('${q.id}','c',this.value,1)"><input placeholder="Finding" value="${e(x.f||'')}" style="flex:1" oninput="sa('${q.id}','f',this.value,1)"><select onchange="sa('${q.id}','sev',this.value,1)">${SEV.map(z=>`<option ${x.sev==z?'selected':''}>${z}`).join('')}</select></div></div>`}).join('')}</div>`).join('')}<div class="card"><b>Monitoring Score: <span id="sc">${score(r)}</span>%</b> · Signature (typed name): <input id="sg" value="${e(r.sig)}"></div><button class="s" onclick="draft()">Save Draft</button> <button onclick="subm()">Submit Monitoring</button> <button class="s" onclick="if(cur._corr){cur.ans=JSON.parse(cur.hist.pop().ansPrev);delete cur._corr}cur=null;R()">Close</button>`}
function sa(q,k,v,nr){(cur.ans[q]=cur.ans[q]||{sev:'Minor'})[k]=v;const s=document.getElementById('sc');if(s)s.textContent=score(cur)}
function draft(){cur.sig=sg.value;if(!db.records.includes(cur))db.records.push(cur);log('Draft saved',cur.id);alert('Draft saved');R()}
function subm(){if(!sg.value.trim())return alert('Signature (typed name) required');if(cur._corr){const p=cur.score;cur.sig=sg.value;cur.score=score(cur);delete cur._corr;log('Monitoring corrected',cur.id,p+'%',cur.score+'%');sel=cur.id;cur=null;R();return}const s=score(cur);if(!confirm('Submit monitoring with score '+s+'%? The record cannot be edited afterwards.'))return;const n=db.records.filter(r=>r.status=='Submitted').length+245;cur.sig=sg.value;cur.score=s;cur.status='Submitted';cur._old=cur.id;cur.id='PENDING-'+uid();cur.signedAt=new Date().toISOString();if(!db.records.includes(cur))db.records.push(cur);const t=cur;cur=null;sel=null;sync().then(m=>{sel=((m||{}).map||{})[t.id]||null;if(!sel)alert('Submission was not accepted by the server');R()})}
function recV(id){const r=db.records.find(x=>x.id==id);if(r.status=='Draft'&&me.role=='Supervisor'){cur=r;sel=null;return form()}const v=verOf(r),a=db.agents.find(x=>x.id==r.agent);return`<div class="np"><button class="s" onclick="sel=null;R()">Back</button> <button onclick="log('PDF generated','${r.id}');window.print()">Print / Save as PDF</button> ${me.role=='QA'&&!r.qa?`<button class="s" onclick="qaSign('${r.id}')">QA sign</button>`:''} ${r.status=='Submitted'&&(me.role=='Admin'||me.id==r.sup)?`<button class="s" onclick="startCorr('${r.id}')">Correct record</button>`:''}</div><div class="card" style="border:1px solid var(--bd);padding:20px;margin-top:10px"><div style="text-align:center"><h2>${e(tplOf(r).name)}</h2>Version ${r.v}</div><table><tr><th>Record ID</th><td>${r.id}</td><th>Date</th><td>${r.date}</td></tr><tr><th>Agent</th><td>${e(a.name)} (${e(a.code)})</td><th>Program</th><td>${e(a.program)}</td></tr><tr><th>Supervisor</th><td>${e(sup(r.sup))}</td><th>Score</th><td><b>${r.score}%</b></td></tr></table>${v.sections.map(s=>`<h3>${e(s.title)}</h3><table><tr><th style="width:40px">#</th><th>Question</th><th style="width:70px">Answer</th><th>Comments / Findings</th></tr>${s.qs.map(q=>{const x=r.ans[q.id]||{};return`<tr><td>${q.n}</td><td>${e(q.text)}</td><td>${e(x.a||'')}</td><td>${e(x.c||'')}${x.f?`<div><b>Finding (${x.sev}):</b> ${e(x.f)}</div>`:''}</td></tr>`}).join('')}</table>`).join('')}<p style="margin-top:24px">Supervisor signature: <b><i>${e(r.sig)}</i></b> · ${(r.signedAt||'').replace('T',' ').slice(0,16)}</p><p>QA signature: ${r.qa?`<b><i>${e(r.qa.name)}</i></b> · ${r.qa.at.replace('T',' ').slice(0,16)}`:'____________________'}</p>${(r.hist||[]).length?`<h3>Correction history</h3>${r.hist.map(h=>`<div>${h.t.slice(0,16).replace('T',' ')} · ${e(h.u)} · ${e(h.reason)} (previous score ${h.prev}%)</div>`).join('')}`:''}${r.demo?'<p class="demo">Demo data</p>':''}</div>`}
let fq={s:'',p:'',d:''};
const isO=f=>!['Completed','Closed'].includes(f.x.status);
function fxS(id,q,k,v){const r=db.records.find(x=>x.id==id);r.fx=r.fx||{};const o=r.fx[q]=r.fx[q]||{status:'Open'};log('Finding updated',id+'/'+q,String(o[k]||''),String(v));o[k]=v;R()}
function fxC(f){const x=f.x,id=f.r.id,q=f.q.id,a=`'${id}','${q}'`;return`<select onchange="fxS(${a},'status',this.value)">${['Open','In Progress','Completed','Closed'].map(s=>`<option ${s==x.status?'selected':''}>${s}`).join('')}</select>${x.due&&x.due<today()&&isO(f)?' <span class="over">Overdue</span>':''}<br><input placeholder="Responsible" value="${e(x.resp||'')}" style="width:110px" onchange="fxS(${a},'resp',this.value)"> <input type="date" value="${x.due||''}" onchange="fxS(${a},'due',this.value)"> <label><input type="checkbox" ${x.capa?'checked':''} onchange="fxS(${a},'capa',this.checked)"> CAPA</label>`}
function qaSign(id){const r=db.records.find(x=>x.id==id);r.qa={name:me.name,at:new Date().toISOString()};log('QA signed',id);R()}
function startCorr(id){const why=prompt('Reason for correction (recorded in audit trail):');if(!why)return;const r=db.records.find(x=>x.id==id);r.hist=r.hist||[];r.hist.push({t:new Date().toISOString(),u:me.name,reason:why,prev:r.score,ansPrev:JSON.stringify(r.ans)});r._corr=1;cur=r;sel=null;view='mon';R()}
function importA(){let n=0;im.value.split('\n').forEach(l=>{const p=l.split(/[,\t]/).map(x=>x.trim());if(p.length<2||!p[0])return;db.agents.push({id:uid(),name:p[0],code:p[1],program:p[2]||'Heart Care',sup:me.role=='Supervisor'?me.id:db.users.find(u=>u.role=='Supervisor').id,start:today(),status:'Active',freq:'Weekly',per:4});n++});log('Agents imported',n+' rows');R()}
function imF(i){const r=new FileReader();r.onload=()=>im.value=r.result;r.readAsText(i.files[0])}
function csv(x){const rows=[['ID','Date','Agent','Program','Supervisor','Annex','Version','Score','Findings','Status']].concat(recs().map(r=>{const a=db.agents.find(x=>x.id==r.agent);return[r.id,r.date,a.name,a.program,sup(r.sup),tplOf(r).name,r.v,r.score,fnd().filter(f=>f.r==r).length,r.status]}));const b=x?new Blob(['<table>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+e(c)+'</td>').join('')+'</tr>').join('')+'</table>'],{type:'application/vnd.ms-excel'}):new Blob([rows.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=x?'monitoring_report.xls':'monitoring_report.csv';l.click();log('Export',x?'Excel':'CSV')}
boot();
</script></body></html>
